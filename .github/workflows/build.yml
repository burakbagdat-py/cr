name: APK Derle

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Test
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: APK derle
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk KriptoRadar.apk
      - name: APK'yı yükle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: KriptoRadar-apk
          path: KriptoRadar.apk
      - name: İndirme linkini güncelle (Release)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk KriptoRadar.apk \
            --target "$GITHUB_SHA" \
            --title "Kripto Radar (son sürüm)" \
            --notes "Telefondan indirip kurun: https://github.com/${{ github.repository }}/releases/download/apk/KriptoRadar.apk  — Commit: ${GITHUB_SHA::7}"
